name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:standards
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Check touch and normal motion
        run: npm test
        env:
          RESPONSIVE_WIDTHS: 320,360,390
          RESPONSIVE_TOUCH: 'true'
          RESPONSIVE_MOTION: normal
      - name: Keep responsive reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: responsive-${{ matrix.os }}-${{ github.sha }}
          path: output/responsive/runs/
          if-no-files-found: ignore
          retention-days: 14
