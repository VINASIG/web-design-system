name: Verify and deploy design system

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks (${{ matrix.os }}, ${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        browser: [chromium, firefox, webkit]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RESPONSIVE_ENGINE: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:standards
      - run: node --test tests/paths.test.ts
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm test
      - name: Check touch and normal motion
        run: npm test
        env:
          RESPONSIVE_WIDTHS: 320,360,390
          RESPONSIVE_TOUCH: 'true'
          RESPONSIVE_MOTION: normal
      - name: Keep responsive reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: responsive-${{ matrix.os }}-${{ matrix.browser }}-${{ github.sha }}
          path: |
            output/responsive/site-chrome/
            output/responsive/runs/
            output/responsive/localization/
            output/responsive/control-indicators/
            output/responsive/control-surfaces/
            output/responsive/palette/
            output/responsive/destructive-actions/
          if-no-files-found: ignore
          retention-days: 14
      - name: Package verified Pages files
        if: runner.os == 'Linux' && matrix.browser == 'chromium' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy checked documentation
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
